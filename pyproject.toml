[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-agent-bridge"
version = "0.3.5"
description = "Local HTTP and MCP bridge for Zotero-backed agent workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "markdown>=3.6",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "requests>=2.32.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
zotero-agent-bridge = "zotero_agent_bridge.__main__:main"
zotero-agent-bridge-mcp = "zotero_agent_bridge.mcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zotero_agent_bridge*"]
